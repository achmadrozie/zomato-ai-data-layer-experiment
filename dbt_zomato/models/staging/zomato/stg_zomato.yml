version: 2

models:
  - name: stg_zomato__menu
    description: '{{ doc("stg_zomato__menu") }}'
    columns:
      - name: menu_id
        description: '{{ doc("menu_id") }}'
        data_tests:
          - not_null
      - name: food_id
        data_tests:
          - not_null

  - name: stg_zomato__order
    description: One row per source order, with typed values. The timestamp has no known source timezone.
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: order_timestamp
        description: Source wall-clock timestamp parsed as TIMESTAMP_NTZ; UTC is not assumed.
        data_tests:
          - not_null
      - name: order_date
        data_tests:
          - not_null
      - name: customer_id
        data_tests:
          - not_null
      - name: restaurant_id
        data_tests:
          - not_null
      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['Delivered', 'Cancelled', 'Refunded']
      - name: sales_amount
        data_tests:
          - not_null

  - name: stg_zomato__order_item
    description: One row per source order item; food IDs remain text because they are alphanumeric.
    columns:
      - name: order_item_id
        data_tests:
          - unique
          - not_null
      - name: order_id
        data_tests:
          - not_null
      - name: f_id
        description: Source food ID, retained as text for compatibility with the current core model.
        data_tests:
          - not_null

  - name: stg_zomato__restaurant
    columns:
      - name: restaurant_id
        data_tests:
          # - unique
          - not_null

  - name: stg_zomato__user
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null

  - name: stg_zomato__review
    columns:
      - name: review_id
        data_tests:
          - unique
          - not_null

  - name: stg_zomato__food
    columns:
      - name: food_id
        data_tests:
          - not_null
