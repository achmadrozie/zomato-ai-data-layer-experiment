version: 2

models:
  - name: mart_restaurant_currency_lifetime
    description: '{{ doc("mart_restaurant_currency_lifetime") }}'
    columns:
      - name: restaurant_id
        description: '{{ doc("mart_restaurant_currency_lifetime_restaurant_id") }}'
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_restaurant')
                field: restaurant_id
      - name: currency
        description: '{{ doc("mart_restaurant_currency_lifetime_currency") }}'
        data_tests:
          - not_null
      - name: restaurant_name
        description: '{{ doc("mart_restaurant_currency_lifetime_restaurant_name") }}'
      - name: city
        description: '{{ doc("mart_restaurant_currency_lifetime_city") }}'
      - name: cuisine
        description: '{{ doc("mart_restaurant_currency_lifetime_cuisine") }}'
      - name: order_count
        description: '{{ doc("mart_restaurant_currency_lifetime_order_count") }}'
        data_tests:
          - not_null
      - name: delivered_order_count
        description: '{{ doc("mart_restaurant_currency_lifetime_delivered_order_count") }}'
        data_tests:
          - not_null
      - name: delivered_sales_amount
        description: '{{ doc("mart_restaurant_currency_lifetime_delivered_sales_amount") }}'
      - name: avg_customer_rating
        description: '{{ doc("mart_restaurant_currency_lifetime_avg_customer_rating") }}'
      - name: avg_delivery_time_min
        description: '{{ doc("mart_restaurant_currency_lifetime_avg_delivery_time_min") }}'
