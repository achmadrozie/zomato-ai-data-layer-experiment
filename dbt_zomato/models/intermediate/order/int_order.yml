version: 2

models:
  - name: int_order_base
    description: One row per order with identifiers, location, and source-time calendar attributes.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: order_timestamp_source
        description: Source timestamp with no verified timezone; it is not labeled UTC.

  - name: int_order_financials
    description: One row per order with financial components and a reconciliation delta.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: sales_amount_delta
        description: Sales amount minus subtotal less discount plus delivery fee and GST.

  - name: int_order_fulfillment
    description: One row per order with status, rating, and delivery-duration measures.
    columns:
      - name: order_id
        data_tests: [unique, not_null]

  - name: int_order_item_rollup
    description: One row per order with item counts, quantities, and amounts rolled up from order items.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: item_amount_delta
        description: Source line amount minus price times quantity, summed per order.
