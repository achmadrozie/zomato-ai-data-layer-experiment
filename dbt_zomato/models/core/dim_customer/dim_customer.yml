version: 2

models:
  - name: dim_customer
    description: '{{ doc("dim_customer") }}'
    columns:
      - name: customer_id
        description: '{{ doc("dim_customer_customer_id") }}'
        data_tests:
          - unique
          - not_null
      - name: customer_name
        description: '{{ doc("dim_customer_customer_name") }}'
      - name: email
        description: '{{ doc("dim_customer_email") }}'
      - name: age
        description: '{{ doc("dim_customer_age") }}'
      - name: age_segment
        description: '{{ doc("dim_customer_age_segment") }}'
      - name: gender
        description: '{{ doc("dim_customer_gender") }}'
      - name: marital_status
        description: '{{ doc("dim_customer_marital_status") }}'
      - name: occupation
        description: '{{ doc("dim_customer_occupation") }}'
      - name: income_band
        description: '{{ doc("dim_customer_income_band") }}'
      - name: education
        description: '{{ doc("dim_customer_education") }}'
      - name: family_size
        description: '{{ doc("dim_customer_family_size") }}'

semantic_models:
  - name: dim_customer
    description: Customer attributes at one row per customer; direct identifiers are not exposed as dimensions.
    model: ref('dim_customer')
    entities:
      - name: customer_id
        type: primary
        expr: customer_id
    dimensions:
      - name: age_segment
        type: categorical
      - name: gender
        type: categorical
      - name: marital_status
        type: categorical
      - name: occupation
        type: categorical
      - name: income_band
        type: categorical
      - name: education
        type: categorical
